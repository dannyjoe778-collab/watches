<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="goldSealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D3B3" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#8C6D37" />
    </linearGradient>
  </defs>
  <!-- Outer double ring -->
  <circle cx="80" cy="80" r="76" fill="none" stroke="url(#goldSealGrad)" stroke-width="1.5" />
  <circle cx="80" cy="80" r="71" fill="none" stroke="#8C6D37" stroke-width="0.75" stroke-dasharray="2,2" />
  
  <!-- Crown In Center -->
  <g transform="translate(80, 72) scale(0.85)">
    <path d="M -22 10 L 22 10 Q 0 13 -22 10 Z" fill="url(#goldSealGrad)" />
    <path d="M -20 7 L -22 -5 L -11 2 L 0 -10 L 11 2 L 22 -5 L 20 7 Z" fill="url(#goldSealGrad)" />
    <circle cx="0" cy="-12" r="2" fill="#FAF8F5" stroke="#8C6D37" stroke-width="0.6" />
    <circle cx="-22" cy="-7" r="1.5" fill="#FAF8F5" stroke="#8C6D37" stroke-width="0.6" />
    <circle cx="22" cy="-7" r="1.5" fill="#FAF8F5" stroke="#8C6D37" stroke-width="0.6" />
    <polygon points="0,-4 4,3 0,7 -4,3" fill="#FAF8F5" opacity="0.6" />
  </g>

  <!-- Curled text or Brand Initials -->
  <text x="80" y="102" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="2" 
        fill="#16181A" 
        text-anchor="middle">
    A &amp; C
  </text>
  <text x="80" y="116" 
        font-family="sans-serif" 
        font-size="6.5" 
        font-weight="600" 
        letter-spacing="1.5" 
        fill="#8C6D37" 
        text-anchor="middle">
    LONDON
  </text>
  <text x="80" y="126" 
        font-family="sans-serif" 
        font-size="5" 
        font-weight="500" 
        letter-spacing="1" 
        fill="#16181A" 
        opacity="0.7"
        text-anchor="middle">
    VERIFIED PROVENANCE
  </text>
</svg>
